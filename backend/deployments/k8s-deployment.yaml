apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-api-config
data:
  APP_ENV: production
  APP_BASE_URL: https://crm.example.com
  APP_TIMEZONE: Asia/Jakarta
  HTTP_ADDR: ":8080"
  GRPC_ADDR: ":9090"
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: https://crm.example.com
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-api-secret
type: Opaque
stringData:
  DATABASE_URL: postgres://crm:replace-me@postgres:5432/crm?sslmode=require
  JWT_SECRET: replace-with-at-least-32-random-characters
  APP_ENCRYPTION_KEY: replace-with-base64-encoded-32-byte-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-api
  template:
    metadata:
      labels:
        app: crm-api
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/prayogopangestu/crm-system/backend:latest
          command: ["/app/migrate", "-direction", "up", "-dir", "/app/migrations"]
          envFrom:
            - secretRef:
                name: crm-api-secret
      containers:
        - name: api
          image: ghcr.io/prayogopangestu/crm-system/backend:latest
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: crm-api-config
            - secretRef:
                name: crm-api-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: crm-api
spec:
  selector:
    app: crm-api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc

