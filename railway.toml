version = 1

[frontend]
builder = "dockerfile"
dockerfilePath = "frontend/Dockerfile"
envVars = [
  "NODE_ENV=production",
  "NEXT_PUBLIC_API_URL=${{ backend.RAILWAY_PRIVATE_DOMAIN }}/api"
]

[postgres]
image = "postgres:17-alpine"

[redis]
image = "redis:7-alpine"

[backend]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"
envVars = [
  "APP_ENV=production",
  "APP_BASE_URL=${{ frontend.RAILWAY_PUBLIC_DOMAIN }}",
  "APP_TIMEZONE=Asia/Jakarta",
  "LOG_LEVEL=info",
  "HTTP_ADDR=:8080",
  "GRPC_ADDR=:9090",
  "DATABASE_URL=postgres://${{ postgres.POSTGRES_USER }}:${{ postgres.POSTGRES_PASSWORD }}@${{ postgres.RAILWAY_PRIVATE_DOMAIN }}:5432/${{ postgres.POSTGRES_DB }}?sslmode=require",
  "REDIS_URL=redis://default:${{ redis.REDIS_PASSWORD }}@${{ redis.RAILWAY_PRIVATE_DOMAIN }}:6379/0",
  "JWT_SECRET=${{ JWT_SECRET }}",
  "APP_ENCRYPTION_KEY=${{ APP_ENCRYPTION_KEY }}",
  "CORS_ALLOWED_ORIGINS=${{ frontend.RAILWAY_PUBLIC_DOMAIN }}"
]
